<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Ultimate Shower Countdown</title>
    <link href="https://github.com/necolas/normalize.css/blob/fc091cce1534909334c1911709a39c22d406977b/normalize.css" rel="stylesheet" />
    <link href="style.css" rel="stylesheet" />
    <script src="countdown.js"></script>
</head>
<body>
    <section class="hideme">
        <div><span id="weeks">0</span><small>Weeks</small></div>
        <div><span id="days">0</span><small>Days</small></div>
        <div><span id="hours">0</span><small>Hours</small></div>
        <div><span id="minutes">0</span><small>Minutes</small></div>
        <div><span id="seconds">0</span><small>Seconds</small></div>
    </section>
    <section class="thisSec">
        <h1><span class="renu">Renu's</span> Ultimate Shower Countdown!</h1>
        <div id="countdown">
            <div><small>Estimated Showers remaining</small><span id="showers">0</span></div>
            <div><small>Estimated Showers at the Quiet Place</small><span id="QPshowers">0</span></div>
        </div>
    </section>
    
    

<script>
document.addEventListener("DOMContentLoaded", function () {

  // ✅ Use ISO format (more reliable)
  const targetDate = new Date("2063-01-01T00:00:00").getTime();
  const QPtargetDate = new Date("2027-01-01T00:00:00").getTime();

  function updateCountdown() {
    const now = Date.now();
    const difference = targetDate - now;
    const QPdifference = QPtargetDate - now;

    if (difference <= 0) {
      document.getElementById("countdown").innerHTML = "Time's up!";
      clearInterval(timer);
      return;
    }

    const weeks = Math.floor(difference / (1000 * 60 * 60 * 24 * 7));
    const days = Math.floor((difference / (1000 * 60 * 60 * 24)) % 7);
    const hours = Math.floor((difference / (1000 * 60 * 60)) % 24);
    const minutes = Math.floor((difference / (1000 * 60)) % 60);
    const seconds = Math.floor((difference / 1000) % 60);
    const showers = weeks * 3;
    const QPshowers = Math.floor(QPdifference / (1000 * 60 * 60 * 24 * 7)) * 3;

    document.getElementById("weeks").textContent = weeks;
    document.getElementById("days").textContent = days;
    document.getElementById("hours").textContent = hours;
    document.getElementById("minutes").textContent = minutes;
    document.getElementById("seconds").textContent = seconds;
    document.getElementById("showers").textContent = showers;
    document.getElementById("QPshowers").textContent = QPshowers;
  }

  updateCountdown();
  const timer = setInterval(updateCountdown, 1000);

});
</script>
</body>
</html>
