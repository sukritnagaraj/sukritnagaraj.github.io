<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maybe is a nice word</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section>
        <h1>Maybe is a nice word...</h1>
        <h2>But <em><strong>No</strong></em> is better</h2>
        <h3>Struggling to say a "no"? This could help.</h3>
    </section>
    <section>
    <div class="qa">

        <div class="question">Select any appropriate response:</div>

        <div class="answer">
            <div class="ans">
                <input type="radio" name="q" id="yes">
                <label for="yes">Yes</label>
            </div>

            <div class="ans">
                <input type="radio" name="q" id="maybe">
                <label for="maybe">Maybe</label>
            </div>
            <div class="ans">
                <input type="radio" name="q" id="no">
                <label for="no">No</label>
            </div>
        </div>

        <div class="messages">
            <div class="message yes-step1">A "Yes" is a "Maybe"...</div>
            <div class="message yes-step2">...and a "Maybe"...</div>
            <div class="message yes-step3">...is a "No".</div>

            <div class="message maybe-step1">A "Maybe"...</div>
            <div class="message maybe-step2">...is a "No".</div>

            <div class="message no-step">Well done! Now read it aloud. "No".</div>
        </div>

    </div>
     </section>
</body>
</html>
