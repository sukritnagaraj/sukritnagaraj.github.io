<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAQ Section (CSS Only)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: auto;
            padding: 20px;
        }

        details {
            border-bottom: 1px solid #ccc;
            margin-bottom: 10px;
            padding-bottom: 10px;
        }

        summary {
            cursor: pointer;
            font-weight: bold;
            background: #f1f1f1;
            padding: 10px;
            border-radius: 5px;
            list-style: none;
        }

        summary::marker {
            display: none;
        }

        .answer {
            padding: 10px;
            background: #e8e8e8;
            border-radius: 5px;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <h2>FAQs</h2>

    <details>
        <summary>What is HTML?</summary>
        <div class="answer">HTML stands for HyperText Markup Language.</div>
    </details>

    <details>
        <summary>What is CSS?</summary>
        <div class="answer">CSS stands for Cascading Style Sheets.</div>
    </details>

    <details>
        <summary>What is JavaScript?</summary>
        <div class="answer">JavaScript is a scripting language for web development.</div>
    </details>

</body>
</html>
